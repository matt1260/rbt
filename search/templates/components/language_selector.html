<!-- Language Selector Component -->
<!-- Add this near the top of chapter.html, nt_chapter.html templates -->

<div class="language-selector" style="position: fixed; top: 80px; right: 20px; z-index: 999; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <label for="language-select" style="font-size: 13px; margin-right: 6px;">🌐 Language:</label>
    <select id="language-select" onchange="changeLanguage(this.value)" style="padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;">
        <option value="en" {% if current_language == 'en' %}selected{% endif %}>English</option>
        {% for lang_code, lang_name in supported_languages.items %}
        <option value="{{ lang_code }}" {% if current_language == lang_code %}selected{% endif %}>{{ lang_name }}</option>
        {% endfor %}
    </select>
</div>

<script>
function changeLanguage(langCode) {
    const url = new URL(window.location);
    const segments = url.pathname.split('/').filter(Boolean);
    const languagePrefixes = new Set(['es', 'pt', 'fr', 'de', 'it', 'ru', 'uk', 'el', 'sv', 'da', 'no', 'fi', 'cs', 'sk', 'hr', 'sr', 'bg', 'ca', 'zh', 'zh-TW', 'ja', 'ko', 'mn', 'ar', 'hi', 'bn', 'pa', 'ta', 'te', 'mr', 'gu', 'kn', 'ml', 'ur', 'fa', 'ps', 'nl', 'pl', 'tr', 'vi', 'th', 'id', 'ms', 'tl', 'km', 'lo', 'my', 'ceb', 'jv', 'ro', 'hu', 'sw', 'ha', 'yo', 'ig', 'am', 'om', 'zu', 'af', 'su', 'mad', 'hmn', 'az', 'ku', 'uz', 'kk', 'ka', 'lt', 'lv', 'et', 'sl']);
    const hasLanguagePrefix = segments.length >= 3 && languagePrefixes.has(segments[0]);
    const contentSegments = hasLanguagePrefix ? segments.slice(1) : segments;

    if (contentSegments.length >= 2 && langCode !== 'en') {
        url.pathname = '/' + [langCode, ...contentSegments].join('/') + '/';
    } else if (contentSegments.length >= 2) {
        url.pathname = '/' + contentSegments.join('/') + '/';
    }
    url.searchParams.delete('lang');
    window.location.href = url.toString();
}
</script>

<style>
@media (max-width: 768px) {
    .language-selector {
        position: static !important;
        margin: 10px auto;
        max-width: 300px;
    }
}
</style>
